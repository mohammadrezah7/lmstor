{% extends 'base.html' %}
{% block title %}کتابخانه{% endblock %}
{% block content %}
<div class="page-header">
    <h3><i class="fas fa-book-open ms-2"></i>کتابخانه</h3>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'core:dashboard' %}">داشبورد</a></li>
            <li class="breadcrumb-item active">کتابخانه</li>
        </ol>
    </nav>
</div>
<div class="card">
    <div class="card-header">لیست کتاب‌ها</div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>عنوان</th><th>نویسنده</th><th>ناشر</th><th>موجودی</th></tr></thead>
            <tbody>
                {% for b in books %}
                <tr><td>{{ b.bookid }}</td><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.publisher }}</td><td>{{ b.copiesavailable }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
